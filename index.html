<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salasilah Keluarga</title>
<style>
:root{--bg:#f6f2ea;--ink:#33312e;--card:#fffdf9;--mute:#857f74;--acc:#1f6f6b;--panel:#fffdf9;--line:#33312e;--cbg-l:86%;--cfg:#2a2926;--csub:#55524c;--cg:linear-gradient(135deg,#fffdf9,#efe6d3);--bg2:#e6dcc6;--g1:rgba(31,111,107,.22);--g2:rgba(224,160,70,.26)}
@media (prefers-color-scheme:dark){:root{--bg:#1d1c1a;--ink:#ece7dc;--card:#262522;--mute:#9a9487;--acc:#5fc2bb;--panel:#262522;--line:#c9c3b6;--cbg-l:24%;--cfg:#ece7dc;--csub:#b9b3a6;--cg:linear-gradient(135deg,#2c2b28,#363430);--bg2:#141311;--g1:rgba(95,194,187,.16);--g2:rgba(230,150,70,.12)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg2)}
html,body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 12% 0%,var(--g1),transparent 46%),radial-gradient(circle at 92% 18%,var(--g2),transparent 42%),radial-gradient(circle at 50% 100%,var(--g1),transparent 50%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
footer{text-align:center;padding:14px 16px 20px;font-size:12px;letter-spacing:.1em;color:var(--mute);border-top:1px dashed rgba(128,128,128,.4);margin:0 24px;flex:none}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 16px 6px;flex:none}
h1{margin:0;width:100%;text-align:center;font:500 clamp(26px,4.5vw,48px)/1.1 "Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;letter-spacing:.02em}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
button,.btn{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;transition:background .15s,color .15s,transform .15s,box-shadow .15s,filter .15s}
button:hover,.btn:hover{background:var(--ink);color:var(--bg)}
button:active{transform:scale(.95)}
.acts button:hover,.tools button:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.18)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.act,button.act:hover{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button.act:hover{filter:brightness(1.12)}
#cpanel{display:none;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:12px;color:var(--mute)}
#cpanel.open{display:flex}
#wrap{flex:1 1 auto;min-height:0;width:100%;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#sizer{position:relative;margin:auto;flex:none}
#stage{position:relative;transform-origin:0 0}
svg{position:absolute;left:0;top:0;pointer-events:none}
svg path{fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-dasharray:7 6;opacity:.85;animation:flow 1.4s linear infinite}
svg path.d{stroke-dasharray:1 7;stroke-width:3}
@keyframes flow{to{stroke-dashoffset:-13}}
.card{position:absolute;width:var(--cw,150px);height:var(--ch,52px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 10px;background:var(--cg);border:1.5px solid var(--acc);border-radius:999px;line-height:1.25;text-align:center;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .18s cubic-bezier(.2,.9,.3,1.3),box-shadow .18s,background .2s}
.card b{font-size:13px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:100%}
.card span{font-size:11px;color:var(--mute);font-weight:400;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:100%}
.card:hover{background:var(--cg);color:var(--ink);transform:translateY(-4px) scale(1.04);box-shadow:0 10px 20px rgba(0,0,0,.22);z-index:2}
.card.c{--cbg:linear-gradient(135deg,hsl(var(--h) 60% calc(var(--cbg-l) + 6%)),hsl(calc(var(--h) + 25) 55% var(--cbg-l)));background:var(--cbg);color:var(--cfg);border-color:hsl(var(--h) 45% 45%)}
.card.c span{color:var(--csub)}
.card.c:hover{background:var(--cbg);color:var(--cfg)}
.card.pet{border-style:dashed}
.card.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#empty{text-align:center;padding:48px 20px;color:var(--mute);max-width:460px;margin:0 auto}
#empty p{margin:0 0 18px;font-size:15px}

/* popup */
#modal{--ah:170;position:fixed;inset:0;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.open{display:flex;animation:fade .18s ease-out}
.sheet{position:relative;width:min(540px,100%);max-height:min(88vh,88dvh);overflow:auto;background:var(--panel);border:1px solid rgba(128,128,128,.35);border-radius:22px;padding:28px 22px 20px;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:pop .24s cubic-bezier(.2,.9,.3,1.25)}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,hsl(var(--ah) 65% 50%),hsl(calc(var(--ah) + 60) 65% 55%))}
.head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.av{width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;font:600 25px/1 system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,hsl(var(--ah) 65% 48%),hsl(calc(var(--ah) + 50) 65% 40%));box-shadow:0 4px 12px rgba(0,0,0,.25)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
.sheet h2{margin:0 0 2px;font:500 26px/1.15 "Cormorant Garamond","Iowan Old Style",Georgia,serif}
.sub{color:var(--mute);font-size:13px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;padding:14px 16px;background:rgba(128,128,128,.1);border-radius:14px}
dt{color:var(--mute)}
dd{margin:0;white-space:pre-wrap;word-break:break-word}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input,textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--mute);border-radius:10px;padding:8px 10px}
input,textarea{transition:box-shadow .15s,border-color .15s}
input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
textarea{resize:vertical;min-height:70px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts .sp{flex:1}
.acts button{min-height:36px}
#lock input{margin-top:14px}
select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--mute);border-radius:10px;padding:8px 10px}
select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.danger{border-color:#b3261e;color:#b3261e}
.danger:hover{background:#b3261e;color:#fff}
#toast{position:fixed;top:14px;right:14px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast,.card,button{transition:none}#modal.open,.sheet,svg path{animation:none}.card:hover{transform:none}}

@media (max-width:860px){
  header{padding:14px 12px 4px;gap:8px}
  #wrap{padding:10px}
  footer{margin:0 14px;padding:12px 12px 16px}
}

@media (max-width:600px){
  #modal{align-items:flex-end;padding:0}
  .sheet{width:100%;max-height:92dvh;border-radius:22px 22px 0 0;padding:26px 16px calc(16px + env(safe-area-inset-bottom));animation:rise .26s cubic-bezier(.2,.9,.3,1.1)}
  .sheet h2{font-size:23px}
  .av{width:50px;height:50px;font-size:22px}
  dl{grid-template-columns:1fr;gap:2px 0;padding:12px 14px}
  dt{font-size:12px;margin-top:6px}
  .acts{gap:8px}
  .acts button{flex:1 1 calc(50% - 8px);min-height:44px;font-size:14px}
  .acts .sp{display:none}
  input,textarea,select{font-size:16px;min-height:44px}
  textarea{min-height:80px}
  .tools button,#cpanel button{min-height:40px;padding:8px 16px}
  #toast{left:12px;right:12px;top:max(12px,env(safe-area-inset-top));text-align:center}
  footer{font-size:11px;margin:0 12px}
}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}

@media (max-height:480px) and (orientation:landscape){
  header{padding:6px 12px 2px;gap:4px}
  h1{font-size:22px}
  #wrap{padding:6px}
  footer{padding:6px 12px 10px}
  .sheet{max-height:96dvh;padding-top:22px}
}

@media (hover:none){
  .card:hover{transform:none;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .acts button:hover,.tools button:hover{transform:none;box-shadow:none}
}
</style>
</head>
<body>
<header>
  <h1>Salasilah Keluarga</h1>
  <div class="tools">
    <span id="st" style="font-size:12px;color:var(--mute)"></span>
    <button id="fit" title="Muat tree dalam skrin">Fit skrin</button>
    <button id="clr" aria-expanded="false">Warna</button>
  </div>
  <div id="cpanel">
    <span>Warna ikut:</span>
    <button data-m="none">Tiada</button>
    <button data-m="gen">Generasi</button>
    <button data-m="branch">Cabang</button>
  </div>
</header>
<div id="wrap"><div id="sizer"><div id="stage"></div></div></div>
<footer id="foot">Hak Cipta Oleh S.I.N.A.R.S</footer>

<div id="modal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="v-name">
    <div id="view">
      <div class="head">
        <div class="av" id="v-av"></div>
        <div><h2 id="v-name"></h2><div class="sub" id="v-rel"></div></div>
      </div>
      <dl id="v-info"></dl>
      <div class="acts">
        <button id="a-edit" class="act">Edit</button>
        <button id="a-child">+ Anak</button>
        <button id="a-spouse">+ Pasangan</button>
        <button id="a-father">+ Ayah</button>
        <button id="a-mother">+ Mak</button>
        <button id="a-pet">+ Haiwan</button>
        <span class="sp"></span>
        <button id="a-close">Tutup</button>
      </div>
    </div>
    <div id="lock" hidden>
      <h2>Edit dikunci</h2>
      <div class="sub">Masukkan password untuk teruskan.</div>
      <input id="l-pass" type="password" autocomplete="off" placeholder="Password">
      <div id="l-err" class="sub" style="color:#b3261e;margin-top:8px;min-height:1em"></div>
      <div class="acts">
        <button id="l-ok" class="act">Buka</button>
        <span class="sp"></span>
        <button id="l-cancel">Batal</button>
      </div>
    </div>
    <div id="edit" hidden>
      <div class="row">
        <div><label for="f-name">Nama</label><input id="f-name"></div>
        <div><label for="f-g">Jantina</label><select id="f-g"><option value="">Pilih jantina</option><option value="A">Lelaki</option><option value="M">Perempuan</option></select></div>
      </div>
      <div class="row">
        <div><label for="f-rel">Hubungan</label><select id="f-rel"></select><input id="f-relx" hidden placeholder="Tulis hubungan" style="margin-top:6px"></div>
        <div id="w-ord"><label for="f-ord">Anak ke</label><select id="f-ord"></select></div>
      </div>
      <div class="row">
        <div><label for="f-born">Tarikh lahir</label><input id="f-born" type="date"></div>
        <div><label for="f-note">Nota</label><textarea id="f-note"></textarea></div>
      </div>
      <div class="acts">
        <button id="e-done" class="act">Siap</button>
        <span class="sp"></span>
        <button id="a-del" class="danger">Padam</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const EDIT_PASS='0000';
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbyo2Igiz6auWG5gyV5PWZOFL2J-PTKqqp0GFBQfZ48Kjv__IkBbGHAySmFzpdyMiszxyQ/exec';
const KEY='salasilah.v1';
let W=150,H=52,GX=28,GY=72,CG=36;

function metrics(){
  const n=document.getElementById('wrap')?.clientWidth||innerWidth;
  const m=n<480?[124,48,12,56,14]:(n<860?[136,50,18,64,24]:[150,52,28,72,36]);
  const ch=m[0]!==W||m[1]!==H||m[2]!==GX||m[3]!==GY||m[4]!==CG;
  [W,H,GX,GY,CG]=m;
  const r=document.documentElement.style;
  r.setProperty('--cw',W+'px');
  r.setProperty('--ch',H+'px');
  return ch;
}
metrics();

const HUE_G=[200,150,35,340,265,15,95,300];
let db=load(), sel=null, mode='view', placed=new Set(), unlocked=false, pending=null;
let colorMode=localStorage.getItem(KEY+'.color')||'none', dim=null, fitOn=localStorage.getItem(KEY+'.fit')!=='0';

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.people)) return norm(d);
  }catch(e){}
  return {people:[],tomb:{}};
}
function norm(d){
  const ids=new Set(d.people.map(p=>p.id)); d.tomb=d.tomb||{};
  d.people.forEach(p=>{
    p.updatedAt=p.updatedAt||1; p.name=p.name||''; p.rel=p.rel||''; p.born=p.born||''; p.note=p.note||'';
    p.g=(p.g==='A'||p.g==='M')?p.g:'';
    p.ord=/^([1-9]|10)$/.test(String(p.ord||''))?String(p.ord):'';
    p.parents=(p.parents||[]).filter(x=>ids.has(x));
    p.spouse=ids.has(p.spouse)?p.spouse:null; p.pet=!!p.pet;
  });
  const pid=new Set(); d.people.forEach(p=>p.parents.forEach(x=>pid.add(x)));
  const guess=p=>{const r=(p.rel||'').toLowerCase(),a=/\b(ayah|abah|bapa|ayahanda|papa|dad|abi)\b/.test(r),m=/\b(mak|emak|ibu|ummi|umi|mama|bonda|mom)\b/.test(r);return a&&!m?'A':(m&&!a?'M':'')};
  const now=Date.now();
  d.people.forEach(p=>{if(pid.has(p.id)&&!p.g){const g=guess(p);if(g){p.g=g;p.updatedAt=now}}});
  d.people.forEach(p=>{if(pid.has(p.id)&&!p.g&&p.spouse){const s=d.people.find(x=>x.id===p.spouse);if(s&&s.g){p.g=s.g==='A'?'M':'A';p.updatedAt=now}}});
  return d;
}
function save(push=true){
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Gagal simpan dalam browser ni.')}
  if(push&&typeof cfg!=='undefined'&&cfg.url){clearTimeout(save.t);save.t=setTimeout(sync,1500)}
}
const uid=()=>Math.random().toString(36).slice(2,9);
const P=id=>db.people.find(p=>p.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- layout ---------- */
function build(p,d){
  placed.add(p.id);
  const sp=p.spouse&&P(p.spouse), members=[p];
  if(sp&&!placed.has(sp.id)){members.push(sp);placed.add(sp.id)}
  if(members.length>1&&members[0].g==='M'&&members[1].g==='A')members.reverse();
  const ids=members.map(m=>m.id);
  const ch=db.people.filter(c=>!placed.has(c.id)&&c.parents.some(x=>ids.includes(x)))
    .sort((a,b)=>(a.pet-b.pet)||((+a.ord||99)-(+b.ord||99)));
  const n={members,d,kids:[]};
  ch.forEach(c=>{if(!placed.has(c.id))n.kids.push(build(c,d+1))});
  n.own=members.length*W+(members.length-1)*CG;
  n.kw=n.kids.reduce((a,k)=>a+k.w,0)+Math.max(0,n.kids.length-1)*GX;
  n.w=Math.max(n.own,n.kw);
  return n;
}
function place(n,x0){
  n.x=x0+(n.w-n.own)/2; n.y=n.d*(H+GY);
  let x=x0+(n.w-n.kw)/2;
  n.kids.forEach(k=>{place(k,x);x+=k.w+GX});
}
function layout(){
  placed=new Set(); const roots=[];
  const isRoot=p=>!p.parents.length&&!(p.spouse&&P(p.spouse)&&P(p.spouse).parents.length);
  db.people.forEach(p=>{if(!placed.has(p.id)&&isRoot(p))roots.push(build(p,0))});
  db.people.forEach(p=>{if(!placed.has(p.id))roots.push(build(p,0))});
  let x=16; roots.forEach(r=>{place(r,x);x+=r.w+GX*2});
  return {roots,w:Math.max(x-GX*2+16,240)};
}

/* ---------- render ---------- */
function render(){
  metrics();
  const stage=document.getElementById('stage');
  if(!db.people.length){
    stage.style.width='auto';stage.style.height='auto';dim=null;fit();
    stage.innerHTML='<div id="empty"><p>Belum ada sesiapa. Mula dengan diri kau, lepas tu tambah mak ayah, pasangan dan anak.</p><button id="first">Tambah orang pertama</button> <button id="conn">Sambung Sync (kalau data family dah ada)</button></div>';
    return;
  }
  const {roots,w}=layout(), cards=[], paths=[]; let maxY=0;
  const hue=(n,br)=>colorMode==='gen'?HUE_G[n.d%8]:(br<0?45:HUE_G[br%8]);
  const walk=(n,br)=>{
    n.members.forEach((m,i)=>{
      const x=n.x+i*(W+CG), c=colorMode==='none'?'':' c', h=colorMode==='none'?'':`;--h:${hue(n,br)}`;
      cards.push(`<button class="card${c}${m.pet?' pet':''}${sel===m.id?' on':''}" data-id="${m.id}" style="left:${x}px;top:${n.y}px${h}"><b>${esc(m.name||'Tanpa nama')}</b><span>${esc([m.rel,(m.ord&&!m.pet)?'ke-'+m.ord:''].filter(Boolean).join(' · '))}</span></button>`);
    });
    maxY=Math.max(maxY,n.y+H);
    const two=n.members.length>1;
    if(two)paths.push([`M${n.x+W} ${n.y+H/2}H${n.x+W+CG}`,0]);
    if(n.kids.length){
      const ox=two?n.x+W+CG/2:n.x+W/2, oy=two?n.y+H/2:n.y+H, by=n.y+H+GY/2;
      const xs=n.kids.map(k=>k.x+W/2);
      paths.push([`M${ox} ${oy}V${by}`,0]);
      paths.push([`M${Math.min(ox,...xs)} ${by}H${Math.max(ox,...xs)}`,0]);
      n.kids.forEach(k=>paths.push([`M${k.x+W/2} ${by}V${k.y}`,k.members[0].pet]));
    }
    n.kids.forEach((k,i)=>walk(k,n.d===0?i:br));
  };
  roots.forEach(r=>walk(r,-1));
  const stageH=maxY+12;
  stage.style.width=w+'px'; stage.style.height=stageH+'px'; dim={w,h:stageH};
  stage.innerHTML=`<svg width="${w}" height="${stageH}">${paths.map(p=>`<path${p[1]?' class="d"':''} d="${p[0]}"/>`).join('')}</svg>`+cards.join('');
  fit();
}

/* ---------- auto resize & fit to screen ---------- */
function fit(){
  const z=document.getElementById('sizer'), s=document.getElementById('stage'), wrap=document.getElementById('wrap');
  if(!dim){z.style.width='auto';z.style.height='auto';s.style.transform='';return}
  const cs=getComputedStyle(wrap);
  const padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const padY=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  const aw=Math.max(120,wrap.clientWidth-padX);
  const ah=Math.max(120,wrap.clientHeight-padY);
  let k=1;
  if(fitOn){
    k=wrap.clientWidth<640
      ? Math.min(1, aw/dim.w, Math.max(0.45, ah/dim.h))
      : Math.min(1, aw/dim.w, ah/dim.h);
  }
  s.style.transform=k<1?`scale(${k})`:'';
  z.style.width=Math.ceil(dim.w*k)+'px';
  z.style.height=Math.ceil(dim.h*k)+'px';
  if(wrap.scrollWidth>wrap.clientWidth){
    wrap.scrollLeft=Math.max(0,(wrap.scrollWidth-wrap.clientWidth)/2);
  }
}

function scheduleFit(){
  cancelAnimationFrame(scheduleFit.r);
  scheduleFit.r=requestAnimationFrame(()=>{
    if(metrics())render();
    else fit();
  });
}

if(typeof ResizeObserver!=='undefined'){
  new ResizeObserver(scheduleFit).observe(document.getElementById('wrap'));
}
addEventListener('resize',scheduleFit);
addEventListener('orientationchange',()=>setTimeout(scheduleFit,120));

/* ---------- warna (optional) ---------- */
const $=id=>document.getElementById(id);
function syncColorUI(){
  document.querySelectorAll('#cpanel [data-m]').forEach(b=>b.classList.toggle('act',b.dataset.m===colorMode));
}
$('clr').onclick=()=>{
  const o=$('cpanel').classList.toggle('open'); $('clr').setAttribute('aria-expanded',o);
  scheduleFit();
};
$('cpanel').addEventListener('click',e=>{
  const b=e.target.closest('[data-m]'); if(!b)return;
  colorMode=b.dataset.m; localStorage.setItem(KEY+'.color',colorMode); syncColorUI(); render();
});
$('fit').classList.toggle('act',fitOn);
$('fit').onclick=()=>{
  fitOn=!fitOn;
  localStorage.setItem(KEY+'.fit',fitOn?'1':'0');
  $('fit').classList.toggle('act',fitOn);
  fit();
};
syncColorUI();
if(colorMode!=='none')$('cpanel').classList.add('open');

/* ---------- popup ---------- */
const RELS=['Aku','Ayah','Mak','Datuk','Nenek','Pasangan','Anak','Menantu','Cucu','Ayah mertua','Mak mertua','Adik-beradik','Haiwan'];
$('f-rel').innerHTML='<option value="">Pilih hubungan</option>'+RELS.map(r=>`<option>${r}</option>`).join('')+'<option value="__x">Lain-lain…</option>';
$('f-ord').innerHTML='<option value="">—</option>'+Array.from({length:10},(_,i)=>`<option value="${i+1}">Anak ke-${i+1}</option>`).join('');
function setRel(v){
  const x=v&&!RELS.includes(v);
  $('f-rel').value=x?'__x':(v||''); $('f-relx').hidden=!x; $('f-relx').value=x?v:'';
}
const gLabel=p=>p.g==='A'?(p.pet?'Jantan':'Lelaki'):(p.g==='M'?(p.pet?'Betina':'Perempuan'):'');
function fmtDate(s){
  if(!s)return '';
  try{return new Date(s+'T00:00').toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'})}catch(e){return s}
}
function openPanel(id,m='view'){
  const p=P(id); if(!p)return closePanel();
  sel=id; mode=m; $('lock').hidden=true; pending=null;
  $('f-name').value=p.name; $('f-born').value=p.born; $('f-note').value=p.note; $('f-g').value=p.g||'';
  $('f-ord').value=p.ord||''; setRel(p.rel); $('w-ord').hidden=p.pet;
  $('f-g').options[1].text=p.pet?'Jantan':'Lelaki'; $('f-g').options[2].text=p.pet?'Betina':'Perempuan';
  $('v-name').textContent=p.name||'Tanpa nama';
  $('v-rel').textContent=p.rel||(p.pet?'Haiwan':'');
  let hh=0; for(const ch of p.id)hh=(hh*31+ch.charCodeAt(0))%360;
  $('modal').style.setProperty('--ah',hh);
  $('v-av').textContent=p.pet?'🐾':((p.name||'?').trim().charAt(0).toUpperCase()||'?');
  const info=$('v-info'); info.textContent='';
  const add=(k,v)=>{if(!v)return;const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;info.append(dt,dd)};
  const par=p.parents.map(P).filter(Boolean);
  add('Jantina',gLabel(p));
  add('Anak ke',p.pet?'':p.ord);
  add('Lahir',fmtDate(p.born));
  const names=a=>a.map(x=>x.name||'Tanpa nama').join(', ');
  const sp=p.spouse&&P(p.spouse);
  const mertua=(!par.length&&sp)?sp.parents.map(P).filter(Boolean):[];
  if(par.length){
    add('Ayah',names(par.filter(x=>x.g==='A'))||'—');
    add('Mak',names(par.filter(x=>x.g==='M'))||'—');
    add('Parent (belum set)',names(par.filter(x=>!x.g)));
  }
  add('Pasangan',sp?(sp.name||'Tanpa nama'):'');
  add('Ayah mertua',names(mertua.filter(x=>x.g==='A')));
  add('Mak mertua',names(mertua.filter(x=>x.g==='M')));
  add('Mertua',names(mertua.filter(x=>!x.g)));
  const kids=db.people.filter(c=>c.parents.includes(p.id)&&!c.pet);
  const menantu=kids.map(c=>c.spouse&&P(c.spouse)).filter(x=>x&&!x.parents.includes(p.id));
  add('Anak',names(kids));
  add('Menantu',names(menantu));
  add('Nota',p.note);
  if(!info.children.length)add('Info','Belum ada maklumat. Tekan Edit.');
  const hasA=par.some(x=>x.g==='A'), hasM=par.some(x=>x.g==='M');
  $('a-spouse').hidden=!!p.spouse||p.pet;
  $('a-father').hidden=hasA||par.length>=2||p.pet;
  $('a-mother').hidden=hasM||par.length>=2||p.pet;
  $('a-child').hidden=p.pet; $('a-pet').hidden=p.pet;
  $('view').hidden=m!=='view'; $('edit').hidden=m!=='edit';
  $('modal').classList.add('open'); render();
  if(m==='edit')focusName(); else $('a-edit').focus();
}
function closePanel(){sel=null;pending=null;$('lock').hidden=true;$('modal').classList.remove('open');render()}
function addPerson(o){
  const p=Object.assign({id:uid(),updatedAt:Date.now(),name:'Tanpa nama',rel:'',born:'',note:'',g:'',ord:'',parents:[],spouse:null,pet:false},o);
  db.people.push(p); return p;
}
function focusName(){const e=$('f-name');e.focus();e.select()}
function after(p){save();openPanel(p.id,'edit')}

['name','born','note','g','ord'].forEach(k=>$('f-'+k).addEventListener('input',e=>{
  const p=P(sel); if(!p)return; p[k]=e.target.value; p.updatedAt=Date.now(); save(); render();
}));
function setRelVal(v){const p=P(sel);if(!p)return;p.rel=v.trim();p.updatedAt=Date.now();save();render()}
$('f-rel').addEventListener('input',()=>{
  const x=$('f-rel').value==='__x'; $('f-relx').hidden=!x;
  if(x){$('f-relx').focus();setRelVal($('f-relx').value)}else setRelVal($('f-rel').value);
});
$('f-relx').addEventListener('input',()=>setRelVal($('f-relx').value));
function needG(p){
  if(p.g)return false;
  toast('Set jantina '+(p.name||'dia')+' dulu'); openPanel(p.id,'edit'); $('f-g').focus(); return true;
}
function gate(fn){
  if(unlocked||!EDIT_PASS){fn();return}
  pending=fn; $('view').hidden=true; $('edit').hidden=true; $('lock').hidden=false;
  $('modal').classList.add('open'); $('l-pass').value=''; $('l-err').textContent=''; $('l-pass').focus();
}
function tryUnlock(){
  if($('l-pass').value===EDIT_PASS){unlocked=true;$('lock').hidden=true;const f=pending;pending=null;if(f)f()}
  else{$('l-err').textContent='Password salah';$('l-pass').select()}
}
function cancelLock(){pending=null;$('lock').hidden=true;if(sel&&P(sel))openPanel(sel,'view');else closePanel()}
$('l-ok').onclick=tryUnlock;
$('l-cancel').onclick=cancelLock;
$('l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock()});

$('a-edit').onclick=()=>gate(()=>openPanel(sel,'edit'));
$('e-done').onclick=()=>{const q=P(sel);if(q&&!q.g){toast('Pilih jantina dulu');$('f-g').focus();return}clearTimeout(save.t);openPanel(sel,'view');sync()};
$('a-child').onclick=()=>gate(()=>{
  const p=P(sel); if(needG(p))return;
  const sp=p.spouse&&P(p.spouse);
  if(sp&&!sp.g){sp.g=p.g==='A'?'M':'A';sp.updatedAt=Date.now()}
  const ids=sp?[p.id,sp.id]:[p.id];
  const sibs=db.people.filter(c=>!c.pet&&ids.some(i=>c.parents.includes(i)));
  const next=Math.min(10,Math.max(sibs.length,...sibs.map(c=>+c.ord||0))+1);
  after(addPerson({parents:ids,rel:'Anak',ord:String(next)}));
});
$('a-pet').onclick=()=>gate(()=>{const p=P(sel);after(addPerson({parents:[p.id],pet:true,rel:'Haiwan',name:'Nama haiwan'}))});
$('a-spouse').onclick=()=>gate(()=>{
  const p=P(sel), g=p.g==='M'?'A':(p.g==='A'?'M':'');
  const kids=db.people.filter(c=>!c.pet&&c.parents.length===1&&c.parents[0]===p.id);
  const n=addPerson({spouse:p.id,g,rel:p.parents.length?'Menantu':((kids.length&&g)?(g==='A'?'Ayah':'Mak'):'Pasangan')});
  const now=Date.now(); p.spouse=n.id; p.updatedAt=now;
  kids.forEach(c=>{c.parents.push(n.id);c.updatedAt=now});
  after(n);
});
function addParent(g){
  const p=P(sel), ps=p.spouse&&P(p.spouse), men=!p.parents.length&&ps&&ps.parents.length>0;
  const n=addPerson({g,rel:men?(g==='A'?'Ayah mertua':'Mak mertua'):(g==='A'?'Ayah':'Mak'),name:g==='A'?'Nama ayah':'Nama mak'});
  const key=a=>a.parents.slice().sort().join(','), k=key(p), now=Date.now();
  const sibs=k?db.people.filter(c=>c.id!==p.id&&c.id!==n.id&&!c.pet&&key(c)===k):[];
  const other=p.parents.map(P).filter(Boolean)[0];
  [p,...sibs].forEach(c=>{c.parents.push(n.id);c.updatedAt=now});
  if(other&&!other.spouse){other.spouse=n.id;n.spouse=other.id;other.updatedAt=now}
  after(n);
}
$('a-father').onclick=()=>gate(()=>addParent('A'));
$('a-mother').onclick=()=>gate(()=>addParent('M'));
$('a-close').onclick=closePanel;
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closePanel()});
$('a-del').onclick=()=>{
  const p=P(sel); if(!p)return;
  if(!confirm('Padam '+(p.name||'orang ni')+'?'))return;
  let rm=new Set([p.id]);
  if(db.people.some(c=>c.parents.includes(p.id))&&confirm('Dia ada anak.\nOK = padam semua keturunan sekali.\nCancel = simpan anak, putus link je.')){
    let grew=true;
    while(grew){grew=false;db.people.forEach(c=>{
      if(!rm.has(c.id)&&c.parents.some(x=>rm.has(x))){rm.add(c.id);grew=true}
      const s=c.spouse&&P(c.spouse);
      if(rm.has(c.id)&&s&&!s.parents.length&&!rm.has(s.id)){rm.add(s.id);grew=true}
    })}
  }
  const now=Date.now(); rm.forEach(id=>db.tomb[id]=now);
  db.people=db.people.filter(x=>!rm.has(x.id));
  db.people.forEach(x=>{if(x.parents.some(i=>rm.has(i))||rm.has(x.spouse))x.updatedAt=now});
  norm(db); save(); closePanel(); toast('Dipadam');
};
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('lock').hidden)return cancelLock();
  if(!sel)return;
  if(mode==='edit')openPanel(sel,'view'); else closePanel();
});
$('stage').addEventListener('click',e=>{
  if(e.target.id==='conn')return setupSync();
  if(e.target.id==='first')return gate(()=>{const p=addPerson({name:'Aku',rel:'Aku'});after(p)});
  const c=e.target.closest('.card'); if(c)openPanel(c.dataset.id,'view');
});

render();

/* ---------- sync Google Sheets via Apps Script ---------- */
let cfg={},syncing=false;
try{cfg=JSON.parse(localStorage.getItem(KEY+'.cfg'))||{}}catch(e){}
(function(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('u')&&h.get('k')){
    cfg={url:h.get('u'),key:h.get('k')};
    localStorage.setItem(KEY+'.cfg',JSON.stringify(cfg));
    history.replaceState(null,'',location.pathname+location.search);
  }
})();
if(!cfg.url&&DEFAULT_URL){cfg={url:DEFAULT_URL,key:''};localStorage.setItem(KEY+'.cfg',JSON.stringify(cfg))}
const st=t=>$('st').textContent=t;
const rowOut=p=>({id:p.id,name:p.name,rel:p.rel,born:p.born,note:p.note,parents:p.parents,spouse:p.spouse||'',pet:p.pet,g:p.g||'',ord:p.ord||'',updatedAt:p.updatedAt});
function merge(rows){
  rows.forEach(r=>{
    const t=Number(r.updatedAt)||0, l=P(r.id);
    if(r.deleted==='1'){
      if(!l||l.updatedAt<=t){db.tomb[r.id]=t;db.people=db.people.filter(x=>x.id!==r.id)}
      return;
    }
    if(db.tomb[r.id]&&db.tomb[r.id]>=t)return;
    if(l&&l.updatedAt>=t)return;
    const n={id:r.id,name:r.name,rel:r.rel,born:r.born,note:r.note,parents:r.parents?r.parents.split(','):[],spouse:r.spouse||null,pet:r.pet==='1',g:r.g||'',ord:r.ord||'',updatedAt:t};
    if(l)Object.assign(l,n);else db.people.push(n);
  });
  norm(db);
}
async function sync(){
  if(!cfg.url||syncing)return; syncing=true; st('Sync...');
  try{
    const rows=db.people.map(rowOut).concat(Object.keys(db.tomb).map(id=>({id,deleted:1,updatedAt:db.tomb[id]})));
    const r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({key:cfg.key,rows})});
    const j=await r.json(); if(j.error)throw new Error(j.error);
    merge(j.rows); save(false);
    if(sel&&!P(sel))closePanel(); else if(!sel)render();
    st('Sync '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  }catch(e){st('Sync gagal: '+e.message)}
  syncing=false;
}
function setupSync(){
  const u=prompt('URL web app Apps Script (kosongkan = putuskan sync)',cfg.url||DEFAULT_URL); if(u===null)return;
  if(!u.trim()){cfg={};localStorage.removeItem(KEY+'.cfg');return st('Offline')}
  cfg={url:u.trim(),key:cfg.key||''}; localStorage.setItem(KEY+'.cfg',JSON.stringify(cfg)); sync();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
setInterval(()=>{if(!document.hidden)sync()},30000);
st(cfg.url?'':'Offline (data dalam browser ni je)');
if(cfg.url)sync();
</script>
